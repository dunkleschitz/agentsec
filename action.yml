name: 'agentsec'
description: 'Run agentsec scanners for prompt injection, secret leaks, SSRF, PII, and other AI-agent risks.'
author: 'agentsec contributors'
branding:
  icon: shield
  color: yellow

inputs:
  tools:
    description: 'Comma-separated tool names to run (for example resultguard,secretflow,piiguard).'
    required: false
    default: 'resultguard,secretflow,piiguard,pathfence,shellfence,fetchfence'
  fail-on:
    description: 'Severity threshold passed to each tool as --fail-on (default high).'
    required: false
    default: 'high'
  paths:
    description: 'Workspace paths to scan, space-separated (transcripts, configs, or directories).'
    required: false
    default: '.'
  extra-args:
    description: 'Extra arguments appended to every tool invocation.'
    required: false
    default: ''
  python-version:
    description: 'Python version installed by actions/setup-python.'
    required: false
    default: '3.12'
  sarif:
    description: 'If true, write a per-tool report under sarif-dir (SARIF when the tool supports --sarif, otherwise JSON).'
    required: false
    default: 'true'
  sarif-dir:
    description: 'Directory for per-tool reports, relative to the workspace.'
    required: false
    default: 'agentsec-sarif'
  mcp-snapshot:
    description: 'Optional MCP tools/list snapshot. When set with mcp-lock, also runs toolpin check.'
    required: false
    default: ''
  mcp-lock:
    description: 'Optional toolpin lockfile, used together with mcp-snapshot.'
    required: false
    default: ''

outputs:
  sarif-dir:
    description: 'Directory containing the report files.'
    value: ${{ steps.run.outputs.sarif-dir }}
  failed-tools:
    description: 'Comma-separated tools that exited 1 (findings at or above fail-on).'
    value: ${{ steps.run.outputs.failed-tools }}
  ran-tools:
    description: 'Comma-separated tools that were invoked.'
    value: ${{ steps.run.outputs.ran-tools }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install agentsec from the action repository
      shell: bash
      run: python -m pip install --no-deps "${{ github.action_path }}"
    - name: Run agentsec tools
      id: run
      shell: bash
      env:
        INPUT_TOOLS: ${{ inputs.tools }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_EXTRA_ARGS: ${{ inputs.extra-args }}
        INPUT_SARIF: ${{ inputs.sarif }}
        INPUT_SARIF_DIR: ${{ inputs.sarif-dir }}
        INPUT_MCP_SNAPSHOT: ${{ inputs.mcp-snapshot }}
        INPUT_MCP_LOCK: ${{ inputs.mcp-lock }}
      run: bash "${{ github.action_path }}/scripts/action-run.sh"
